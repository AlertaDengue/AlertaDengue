services:
  postgres:
    environment:
      ENV: "staging"
      PG_STANZA: "staging"
      PGDATA: "/var/lib/postgresql/18/docker"
    ports:
      - "${PSQL_HOST_PORT}:5432"
    volumes:
      - "${PG18_HOST_PGDATA:?PG18_HOST_PGDATA is required}:/var/lib/postgresql"
    command:
      - postgres
      - -p
      - "5432"
      - -c
      - "unix_socket_directories=/var/run/postgresql"
      - -c
      - "max_worker_processes=8"

  web:
    command: bash /opt/runwsgi.sh
    environment:
      DJANGO_SETTINGS_MODULE: "ad_main.settings.staging"
      ENV: "staging"
      DEBUG: "False"
      DJANGO_PORT: "8000"

  celery:
    command: bash /opt/runcelery.sh
    environment:
      DJANGO_SETTINGS_MODULE: "ad_main.settings.staging"
      ENV: "staging"
      DEBUG: "False"
